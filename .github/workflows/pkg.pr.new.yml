name: Publish Any Commit

on:
  pull_request:
    branches: [v2, v3]
    paths-ignore:
      - 'packages/docs/**'
      - 'packages/playground/**'

  push:
    branches:
      - '**'
    tags:
      - '!**'
    paths-ignore:
      - 'packages/docs/**'
      - 'packages/playground/**'

jobs:
  build:
    if: github.repository == 'vuejs/pinia'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Release
        run: pnpm dlx pkg-pr-new publish --compact --pnpm './packages/*'
