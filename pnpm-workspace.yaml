packages:
  - 'packages/*'
shamefullyHoist: true
strictPeerDependencies: false
allowBuilds:
  esbuild: true
  simple-git-hooks: true
  vue-demi: true
  '@parcel/watcher': false
# TEMPORARY: freshly bumped deps published <24h ago, below pnpm 11's minimumReleaseAge.
# Remove this block on/after 2026-07-14 once they age out.
minimumReleaseAgeExclude:
  - '@vue-macros/common'
  - postcss
  - vitepress-plugin-llms
